name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: Pure Kotlin modules (domain, parsers, engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PjvmOnly=true test --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"

  dependency-probe:
    name: Report available Google Maven versions
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable versions
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/room/room-runtime androidx/camera/camera-core \
                   androidx/navigation/navigation-compose androidx/activity/activity-compose androidx/lifecycle/lifecycle-runtime-compose \
                   androidx/work/work-runtime-ktx androidx/datastore/datastore-preferences androidx/core/core-ktx \
                   com/google/mlkit/text-recognition com/google/mlkit/barcode-scanning com/google/mlkit/translate com/google/mlkit/language-id \
                   com/google/mediapipe/tasks-vision androidx/test/ext/junit-ktx androidx/test/core-ktx androidx/test/espresso/espresso-core; do
            v=$(curl -s "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -viE 'alpha|beta|rc|dev' | tail -4 | tr '\n' ' ')
            echo "$a: $v"
          done
