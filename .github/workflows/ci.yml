name: CI

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: Pure Kotlin modules (domain, parsers, engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PjvmOnly=true test --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"

  android:
    name: Android build (debug + release APK, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs and run Android unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease testDebugUnitTest --continue 2>&1 | tee build-log.txt
      - name: Summarise build errors
        if: failure()
        run: |
          echo "==== Compiler errors"; grep -E "^e: |error:|ERROR:|What went wrong|FAILED|> .*failed|Execution failed" -A3 build-log.txt | head -400
      - name: Check 16 KB page alignment of native libraries
        if: always()
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            $BT/zipalign -c -P 16 -v 4 "$apk" | grep -E "lib/|Verification" || true
            $BT/apksigner verify --print-certs "$apk" | head -5
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            samples/scanner-host/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/
            !**/build/reports/configuration-cache/
